
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Forgot Password</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="{% static 'store/css/forgotpass.css' %}" />
</head>
<body>
    <div class="forgotpass-wrapper">
      <div class="password-done-box">
        <img class="password-done-image" src="{% static 'store/images/Westletics_logo.png' %}" alt="Password Reset Image" />
        <p class="password-done-text">
          We've emailed you instructions for setting your password, if an account exists with that email address.
          You should receive them shortly.
        </p>
        <p class="password-done-text">
          If you don't receive an email, please make sure you've entered the address you registered with,
          and check your spam folder.
        </p>
        <p><i class="fa-solid fa-envelope"></i></p>
      </div>
    </div>
  </body>
</html>
