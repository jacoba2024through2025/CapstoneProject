
{% extends 'root.html' %}
{% load static %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="max-width: 450px; width: 100%;">
        <h3 class="mb-3 text-center">Forgot Your Password?</h3>
        <p class="text-muted text-center">Enter your email address below and we'll send you a link to reset your password.</p>
        
        <form method="POST" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Send Reset Email</button>
        </form>
    </div>
</div>
{% endblock %}
