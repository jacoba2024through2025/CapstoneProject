{% extends "root.html" %} {% load static %} 

{% block title %}Payment{% endblock%} 

{% block content %}
<h1>Make a Payment</h1>

<form
  id="payment-form"
  method="POST"
  action="{% url 'create_checkout_session' %}"
>
  {% csrf_token %}
  <input type="hidden" name="amount" value="5000" />
  <!-- Amount in cents -->
  <button id="checkout-button">Pay $50</button>
</form>

<script src="https://js.stripe.com/v3/"></script>
<script>
    const stripe = Stripe("{{ stripe_public_key }}"); // Add your public key here
    
    document.getElementById("checkout-button").addEventListener("click", function (e) {
        e.preventDefault();
        fetch("{% url 'create_checkout_session' %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
            },
            body: new FormData(document.getElementById("payment-form")),
        })
        .then(response => response.json())
        .then(data => {
            if (data.id) {
                stripe.redirectToCheckout({ sessionId: data.id });
            } else {
                alert("Error: " + data.error);
            }
        });
    });
</script>
