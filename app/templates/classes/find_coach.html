
{% extends 'root.html' %}
{% load static %}

{% block content %}
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="author" content="colorlib.com">
  <link href="https://fonts.googleapis.com/css?family=Roboto:400,700" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'findcoach/css/main.css' %}" />
</head>

<body>
  <div class="s007">
    <div class="form-wrapper">
      <h3 class="search-title">Use Our Search Bar To Connect With Experienced Coaches</h3>
      <form>
        <div class="inner-form">
          <div class="basic-search">
            <div class="input-field">
              <div class="icon-wrap">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
                  <path d="..."></path>
                </svg>
              </div>
              <input id="search" type="text" placeholder="Search for a coach..." autocomplete="off" />
              <div class="result-count">
                <span id="result-count-number">0</span> results
              </div>
            </div>
          </div>

          <!-- Advanced Search -->
          <div class="advance-search">
            <span class="desc">Advanced Search</span>
            <div class="row">
              <!-- State Dropdown -->
              <div class="input-field">
                <select name="state" id="state-select">
                  <option value="">All States</option>
                  {% for state_code in coach_states %}
                    <option value="{{ state_code }}">{{ state_code }}</option>
                  {% endfor %}
                </select>
              </div>

              <!-- School Dropdown -->
              <div class="input-field">
                <select name="school" id="school-select">
                  <option value="">All Schools</option>
                  {% for school in coach_schools %}
                    <option value="{{ school }}">{{ school }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="row third">
              <div class="input-field">
                <button class="btn-search" type="button" id="search-button">Search</button>
                <button class="btn-delete" id="delete">Clear Results</button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="results-wrapper"></div>

  <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

  <script src="{% static 'findcoach/js/extention/choices.js' %}"></script>
  <script>
    const coachSearchInput = document.getElementById('search');
    const stateSelect = document.getElementById('state-select');
    const schoolSelect = document.getElementById('school-select');
    const resultsDiv = document.getElementById('results');
    const resultCount = document.getElementById('result-count-number');
    const deleteBtn = document.getElementById('delete');
    const searchBtn = document.getElementById('search-button');

    function performSearch() {
      const query = coachSearchInput.value.trim();
      const state = stateSelect.value;
      const school = schoolSelect.value;

      const params = new URLSearchParams({
        q: query,
        state: state,
        school: school
      });

      fetch(`/search_coaches/?${params.toString()}`)
        .then(response => response.json())
        .then(data => {
          resultsDiv.innerHTML = '';
          resultCount.textContent = data.length;

          if (data.length === 0) {
            resultsDiv.innerHTML = '<p>No results found.</p>';
            return;
          }

          data.forEach(coach => {
            const div = document.createElement('div');
            div.classList.add('coach-result-card');
            div.innerHTML = `
              <div class="coach-header">
                <img src="${coach.profile_image}" alt="${coach.first_name}" class="coach-image">
                <div class="coach-info">
                  <h4 class="coach-name">${coach.first_name} ${coach.last_name}</h4>
                  <p class="coach-username"><strong>Username:</strong> ${coach.username}</p>
                  <p class="coach-email"><strong>Email:</strong> ${coach.email}</p>
                  <p class="coach-rating"><strong>Rating:</strong> ${coach.rating}</p>
                </div>
              </div>
              <div class="coach-details">
                <p><strong>Experience:</strong> ${coach.experience_years} years</p>
                <p><strong>Expertise:</strong> ${coach.expertise}</p>
                <p><strong>State:</strong> ${coach.state}</p>
                <p><strong>School:</strong> ${coach.school}</p>
              </div>
              <div class="coach-actions">
                <a href="${coach.linked_in}" target="_blank" class="linkedin-profile">LinkedIn Profile</a>
              </div>
            `;

            if (coach.classes.length > 0) {
              const classesContainer = document.createElement('div');
              classesContainer.classList.add('coach-classes-container');
              classesContainer.style.display = 'none';

              const viewClassesButton = document.createElement('button');
              viewClassesButton.classList.add('view-classes-button');
              viewClassesButton.textContent = 'View Classes';
              viewClassesButton.addEventListener('click', function () {
                const isVisible = classesContainer.style.display !== 'none';
                classesContainer.style.display = isVisible ? 'none' : 'block';
                viewClassesButton.textContent = isVisible ? 'View Classes' : 'Hide Classes';
              });

              div.appendChild(viewClassesButton);
              div.appendChild(classesContainer);

              coach.classes.forEach(classInfo => {
                const classDiv = document.createElement('div');
                classDiv.classList.add('class-card');

                const priceDisplay = classInfo.class_price <= 0 ? 'Free' : `$${classInfo.class_price}`;
                let buttonHTML = '';

                if (classInfo.has_access) {
                  buttonHTML = `<a href="/class_dashboard/${classInfo.class_id}/" class="class-action-button go-to-class">Go to Class</a>`;
                } else if (classInfo.is_pending) {
                  buttonHTML = `<button class="class-action-button request-access" data-class-id="${classInfo.class_id}" disabled>Request Sent</button>`;
                } else {
                  buttonHTML = `<button class="class-action-button request-access" data-class-id="${classInfo.class_id}">Request Access</button>`;
                }

                classDiv.innerHTML = `
                  <strong>${classInfo.class_name}</strong><br>
                  <p>${classInfo.class_description}</p>
                  <p><strong>Price:</strong> ${priceDisplay}</p>
                  <img src="${classInfo.class_image}" alt="${classInfo.class_name}" class="class-image"><br>
                  ${buttonHTML}
                `;

                classesContainer.appendChild(classDiv);
              });
            }

            resultsDiv.appendChild(div);
          });
        });
    }

    coachSearchInput.addEventListener('input', performSearch);
    searchBtn.addEventListener('click', performSearch);

    deleteBtn.addEventListener("click", function (e) {
      e.preventDefault();
      coachSearchInput.value = '';
      stateSelect.value = '';
      schoolSelect.value = '';
      resultsDiv.innerHTML = '';
      resultCount.textContent = '0';
    });

    document.addEventListener('click', function (e) {
      if (e.target && e.target.classList.contains('request-access')) {
        const button = e.target;
        const classId = button.getAttribute('data-class-id');
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        fetch('/request_class_access/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
          },
          body: JSON.stringify({ class_id: classId })
        })
        .then(response => response.json())
        .then(data => {
          if (data.status === 'success') {
            button.textContent = 'Request Sent';
            button.disabled = true;
          } else {
            alert(data.message);
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Something went wrong. Please try again.');
        });
      }
    });
  </script>
</body>
</html>
{% endblock %}
