
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Change Password</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'store/css/forgotpass.css' %}" />
</head>
<body>
  <div class="forgotpass-wrapper">
    <div class="password-done-box">
      {% if validlink %}
        <h3 class="fp-title">Change Password</h3>
        <form method="POST" class="fp-form">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="fp-button">Change Password</button>
        </form>
      {% else %}
        <p class="password-done-text">
          The password reset link was invalid, possibly because it has already been used.  
          Please request a new password reset.
        </p>
      {% endif %}
    </div>
  </div>
</body>
</html>
